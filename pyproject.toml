[tool.poetry]
name = "youth-policy-agent"
version = "0.1.0"
description = "청년 정책 RAG + MCP 기반 AI 에이전트"
authors = []
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
langchain = "^0.3"
langchain-google-genai = "^2.0"
langchain-community = "^0.3"
langchain-pinecone = "^0.2"
pinecone = "^5.0"
python-dotenv = "^1.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
httpx = "^0.27"
rich = "^13.0"
pypdf = "^4.0"
mcp = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"
mypy = "^1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
